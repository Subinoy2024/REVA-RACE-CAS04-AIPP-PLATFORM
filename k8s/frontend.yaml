apiVersion: apps/v1
kind: Deployment
metadata:
  name: aipp-frontend
  namespace: aipp
  labels:
    app.kubernetes.io/name: aipp-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aipp-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aipp-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aipp-frontend
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 aipp-backend.aipp.svc.cluster.local 8001; do echo waiting for backend; sleep 2; done;']
      containers:
        - name: frontend
          image: dccloudops/aipp-frontend:v0.40.0
          imagePullPolicy: Always
          command: ["python3", "-u", "/app/frontend/gradio_app.py"]
          envFrom:
            - configMapRef:
                name: aipp-config
            - secretRef:
                name: aipp-secret
          ports:
            - containerPort: 3000
              name: http-frontend
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aipp-frontend
  namespace: aipp
  labels:
    app.kubernetes.io/name: aipp-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aipp-platform
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002
      name: http-frontend
  selector:
    app.kubernetes.io/name: aipp-frontend
