apiVersion: apps/v1
kind: Deployment
metadata:
  name: aipp-backend
  namespace: aipp
  labels:
    app.kubernetes.io/name: aipp-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: aipp-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aipp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aipp-backend
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 aipp-postgres.aipp.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
        - name: backend
          image: dccloudops/aipp-backend:v0.40.0
          imagePullPolicy: Always
          command: ["uvicorn", "backend.server:app", "--host", "0.0.0.0", "--port", "8001"]
          envFrom:
            - configMapRef:
                name: aipp-config
            - secretRef:
                name: aipp-secret
          ports:
            - containerPort: 8001
              name: http-backend
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/site/visits
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/site/visits
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aipp-backend
  namespace: aipp
  labels:
    app.kubernetes.io/name: aipp-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: aipp-platform
spec:
  type: NodePort
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30801
      name: http-backend
  selector:
    app.kubernetes.io/name: aipp-backend
