apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: aipp
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: ingress-tunnel
    app.kubernetes.io/part-of: aipp-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: ingress-tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aipp-secret
                  key: CLOUDFLARE_TUNNEL_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
